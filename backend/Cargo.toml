[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

csv = "1.3"

chrono = "0.4.45"
tower-http = { version = "0.7.1", features = ["cors"] }

reqwest = { version = "0.12", features = ["json"] }